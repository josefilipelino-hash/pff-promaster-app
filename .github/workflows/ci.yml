name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependências Linux do Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @momento/desktop build
      - run: ./scripts/check.sh

  # Aplicação instalável para macOS e Windows (artefactos descarregáveis do CI).
  bundle:
    name: Instalador ${{ matrix.name }}
    needs: check
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-2022
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @momento/desktop tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: momento-studio-${{ matrix.name }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
