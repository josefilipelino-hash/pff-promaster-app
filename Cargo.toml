[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "packages/core-types",
    "packages/database",
    "packages/project-management",
    "packages/metadata",
    "packages/import-engine",
    "packages/image-codecs",
    "packages/raw-engine",
    "packages/raw-engine/libraw-sys",
    "packages/image-processing",
    "packages/color-management",
    "packages/ai-analysis",
    "packages/face-analysis",
    "packages/presets",
    "packages/export-engine",
    "packages/gallery",
    "packages/album",
    "packages/task-queue",
    "packages/test-fixtures",
]

[workspace.package]
version = "1.0.0-personal"
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false
authors = ["José Filipe Lino"]

# Versões fixadas na Fase 0. Ver LICENSES.md antes de adicionar dependências.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tempfile = "3"
# Lixo do sistema (macOS, Windows, Linux/freedesktop) para "mover para o lixo" (Fase 13).
trash = "5.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif", "exr", "hdr", "ico", "pnm", "tga"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjp2"] }
tract-onnx = "=0.23.9"
jpeg-decoder = { version = "0.3.2", default-features = false }
kamadak-exif = "0.6.1"
blake3 = "1.8"
lcms2 = "6.2.0"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
png = "0.18.1"
tiff = "0.11.3"
exr = "1.74.2"
webp = { version = "0.3.1", default-features = false }
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
avif-serialize = "0.8.9"
zune-jpegxl = "0.5.2"
openjp2 = "0.6.1"
fs4 = "1.1.0"
ab_glyph = "0.2"
zune-core = "0.5.3"
aes-gcm = "0.10.3"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
sha2 = "0.10.9"
base64 = "0.22"
getrandom = "0.3"
zip = { version = "2.4", default-features = false }
walkdir = "2.5"
rayon = "1.12"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2.8.4"
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "2.7", features = [] }

momento-core-types = { path = "packages/core-types" }
momento-database = { path = "packages/database" }
momento-image-codecs = { path = "packages/image-codecs" }
momento-task-queue = { path = "packages/task-queue" }
momento-metadata = { path = "packages/metadata" }
momento-image-processing = { path = "packages/image-processing" }
momento-presets = { path = "packages/presets" }
momento-import-engine = { path = "packages/import-engine" }
momento-project-management = { path = "packages/project-management" }
momento-test-fixtures = { path = "packages/test-fixtures" }
momento-libraw-sys = { path = "packages/raw-engine/libraw-sys" }
momento-raw-engine = { path = "packages/raw-engine" }
momento-face-analysis = { path = "packages/face-analysis" }
momento-ai-analysis = { path = "packages/ai-analysis" }
momento-color-management = { path = "packages/color-management" }
momento-export-engine = { path = "packages/export-engine" }
momento-gallery = { path = "packages/gallery" }
momento-album = { path = "packages/album" }

[profile.dev.package."*"]
# Dependências optimizadas mesmo em debug: descodificação de imagem em debug puro é demasiado lenta.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
