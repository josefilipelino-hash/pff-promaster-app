[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "packages/core-types",
    "packages/database",
    "packages/project-management",
    "packages/metadata",
    "packages/import-engine",
    "packages/image-codecs",
    "packages/raw-engine",
    "packages/raw-engine/libraw-sys",
    "packages/image-processing",
    "packages/color-management",
    "packages/ai-analysis",
    "packages/face-analysis",
    "packages/presets",
    "packages/export-engine",
    "packages/gallery",
    "packages/album",
    "packages/task-queue",
    "packages/test-fixtures",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
authors = ["José Filipe Lino"]

# Versões fixadas na Fase 0. Ver LICENSES.md antes de adicionar dependências.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif", "exr", "hdr", "ico", "pnm", "tga"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjp2"] }
tract-onnx = "=0.23.9"
jpeg-decoder = { version = "0.3.2", default-features = false }
kamadak-exif = "0.6.1"
blake3 = "1.8"
walkdir = "2.5"
rayon = "1.12"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2.8.4"
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "2.7", features = [] }

momento-core-types = { path = "packages/core-types" }
momento-database = { path = "packages/database" }
momento-image-codecs = { path = "packages/image-codecs" }
momento-task-queue = { path = "packages/task-queue" }
momento-metadata = { path = "packages/metadata" }
momento-image-processing = { path = "packages/image-processing" }
momento-import-engine = { path = "packages/import-engine" }
momento-project-management = { path = "packages/project-management" }
momento-test-fixtures = { path = "packages/test-fixtures" }
momento-libraw-sys = { path = "packages/raw-engine/libraw-sys" }
momento-raw-engine = { path = "packages/raw-engine" }
momento-face-analysis = { path = "packages/face-analysis" }
momento-ai-analysis = { path = "packages/ai-analysis" }

[profile.dev.package."*"]
# Dependências optimizadas mesmo em debug: descodificação de imagem em debug puro é demasiado lenta.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
